[project]
name = "fly-in"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "BLE001",
    "PLR1722",
    "RUF012",
    "SIM102",
    "SIM103",
    "SIM115",
    "TRY002",
    "TRY201",
    "UP040",
    "UP046",
]
